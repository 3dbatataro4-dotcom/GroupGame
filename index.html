<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際經紀人：智能群聊版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- UI 設計系統 (Glassmorphism v2) --- */
        :root {
            --bg-body: #121212;
            --accent-color: #0A84FF;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --bubble-me: #007AFF;
            --bubble-them: #ffffff;
            --text-primary: #000000;
        }

        body {
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--bg-body);
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden; user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #2b1055 0%, #000000 100%);
        }

        #phone {
            width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523060-8da1d56ae167?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        @media (min-width: 480px) { 
            #phone { max-width: 414px; height: 90vh; max-height: 900px; border-radius: 40px; border: 8px solid #222; } 
        }

        /* 頂部狀態列 */
        #status-bar {
            height: 44px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            z-index: 100;
        }

        /* 桌面 */
        #desktop {
            flex: 1; padding: 60px 20px; display: grid; grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, max-content); gap: 20px;
            transition: 0.3s;
        }
        #desktop.minimized { transform: scale(0.9); opacity: 0; pointer-events: none; }

        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon-bg {
            width: 62px; height: 62px; border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 6px;
            backdrop-filter: blur(10px); background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
        }
        .app-name { font-size: 11px; color: white; text-shadow: 0 1px 2px black; }

        /* App 視窗 */
        .app-window {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #f2f2f7; display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
        }
        .app-window.open { transform: translateX(0); }

        .nav-bar {
            height: 50px; display: flex; align-items: center; padding: 0 10px;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
            margin-top: 40px; /* 避開瀏海 */
        }
        .nav-title { flex: 1; text-align: center; font-weight: 700; font-size: 17px; }
        .nav-btn { padding: 10px; color: var(--accent-color); font-size: 16px; cursor: pointer; display: flex; align-items: center; }

        /* 聊天列表 */
        .chat-list { flex: 1; overflow-y: auto; background: white; }
        .chat-item {
            padding: 12px 15px; display: flex; align-items: center;
            border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s;
        }
        .chat-item:active { background: #f5f5f5; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid #eee; }

        /* 聊天室內容 */
        #chat-room { background: #eef1f5; z-index: 20; }
        #msg-container { padding: 15px; padding-bottom: 140px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: slideUp 0.3s ease; }
        .msg-row.me { justify-content: flex-end; }
        
        .msg-bubble {
            max-width: 75%; padding: 10px 14px; border-radius: 18px;
            font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .msg-bubble.them { background: var(--bubble-them); color: #000; border-bottom-left-radius: 4px; }
        .msg-bubble.me { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
        
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .msg-name { font-size: 11px; color: #888; margin-bottom: 2px; margin-left: 5px; }


        /* 輸入框 */
        .input-area {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: #f9f9f9; padding: 10px 15px; box-sizing: border-box;
            display: flex; flex-direction: column; border-top: 1px solid #ddd;
            padding-bottom: 30px;
        }
        #chat-input {
            flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd;
            font-size: 16px; outline: none; background: white;
        }
        #send-btn {
            margin-left: 10px; color: var(--accent-color); font-weight: bold;
            background: none; border: none; font-size: 16px; cursor: pointer;
        }
        #send-btn:disabled { opacity: 0.5; }

        /* 動畫 */
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #home-bar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 5px; background: #000; border-radius: 10px; opacity: 0.2;
            cursor: pointer; z-index: 999;
        }

        /* 新增：社群與行程樣式 */
        .social-post { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .post-header { display: flex; align-items: center; margin-bottom: 10px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
        .post-author { font-weight: bold; font-size: 14px; }
        .post-content { font-size: 14px; line-height: 1.4; margin-bottom: 10px; color: #333; }
        .post-comments { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
        .comment-row { margin-bottom: 6px; display: flex; gap: 6px; }
        .comment-user { font-weight: bold; color: #555; flex-shrink: 0; }
        .comment-input-area { display: flex; margin-top: 10px; gap: 5px; }
        .comment-input { flex: 1; border: 1px solid #ddd; border-radius: 15px; padding: 5px 10px; font-size: 13px; }
        .comment-btn { background: var(--accent-color); color: white; border: none; border-radius: 15px; padding: 5px 12px; cursor: pointer; font-size: 12px; }

        .schedule-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--accent-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .schedule-time { font-size: 12px; color: #888; font-weight: bold; margin-bottom: 4px; }
        .schedule-title { font-size: 15px; font-weight: 600; }
        .schedule-delete { color: #ff3b30; cursor: pointer; font-size: 18px; padding: 0 5px; }
        .schedule-check { color: #ccc; cursor: pointer; font-size: 18px; padding: 0 5px; margin-right: 10px; }
        .schedule-check.done { color: #2ecc71; }
        .schedule-item.done .schedule-title { text-decoration: line-through; color: #aaa; }
        /* 新增：行程標籤樣式 */
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; margin-right: 5px; font-weight: normal; vertical-align: middle; display: inline-block; }
        .tag.gig { background: #9b59b6; } /* 通告 - 紫色 */
        .tag.training { background: #2ecc71; } /* 訓練 - 綠色 */
        .tag.private { background: #f1c40f; color: #333; } /* 私人 - 黃色 */

        /* Modal Styles */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 20px; border-radius: 15px; width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-title { font-weight: bold; margin-bottom: 15px; font-size: 18px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .form-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #f0f0f0; color: #333; }
        .btn-confirm { background: var(--accent-color); color: white; }
        .btn-view { background: #3498db; color: white; }
        .api-key-row { display: flex; gap: 8px; }
        .api-key-row .form-input { flex: 1; min-width: 0; }
        .key-toggle { flex: 0 0 42px; border: 1px solid #ddd; border-radius: 8px; background: #f7f7f7; cursor: pointer; }
        .form-help { display: block; margin-top: 6px; color: #888; font-size: 11px; line-height: 1.45; }

        /* 新增：打字動畫氣泡 */
        .typing-dots { display: inline-block; padding: 0 5px; }
        .typing-dots span { display: inline-block; width: 6px; height: 6px; background: #888; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; margin: 0 2px; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* 新增：貼文操作按鈕 */
        .post-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .action-btn { cursor: pointer; font-size: 13px; color: #888; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { color: var(--accent-color); }
        .action-btn.active { color: #e74c3c; font-weight: bold; }

        /* 新增：建議回覆樣式 */
        .suggestion-container { display: flex; gap: 10px; padding: 0 15px 10px 15px; overflow-x: auto; width: 100%; box-sizing: border-box; }
        .suggestion-chip { background: #fff; color: var(--accent-color); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--accent-color); white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; }
        .suggestion-chip:hover { background: var(--accent-color); color: white; }
        }
    </style>
</head>
<body>

<div id="phone">
    <div id="status-bar">
        <span>10:45</span>
        <span>5G 100%</span>
    </div>

    <div id="desktop">
        <div class="app-icon" onclick="openApp('chat')">
            <div class="app-icon-bg" style="background: linear-gradient(135deg, #2ecc71, #27ae60);">💬</div>
            <div class="app-name">WhizChat</div>
        </div>
        <div class="app-icon" onclick="openApp('social')">
            <div class="app-icon-bg" style="background: linear-gradient(135deg, #3498db, #2980b9);">🐦</div>
            <div class="app-name">FanZone</div>
        </div>
        <div class="app-icon" onclick="openApp('schedule', 'kaos')">
            <div class="app-icon-bg" style="background: linear-gradient(135deg, #f1c40f, #f39c12);">📅</div>
            <div class="app-name">KAOS 行程</div>
        </div>
        <div class="app-icon" onclick="openApp('schedule', 'vizier')">
            <div class="app-icon-bg" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">📅</div>
            <div class="app-name">Vizier 行程</div>
        </div>
        <div class="app-icon" onclick="openApiKeyModal()">
            <div class="app-icon-bg" style="background: linear-gradient(135deg, #5856d6, #af52de);">🔑</div>
            <div class="app-name">AI Key 設定</div>
        </div>
    </div>

    <div id="app-chat" class="app-window">
        <div class="nav-bar">
            <div class="nav-btn" onclick="goHome()">‹ 桌面</div>
            <div class="nav-title">訊息</div>
            <div class="nav-btn" style="width:40px; cursor:default"></div>
        </div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div id="chat-room" class="app-window">
        <div class="nav-bar">
            <div class="nav-btn" onclick="closeChatRoom()">‹ 返回</div>
            <div class="nav-title" id="room-title">Chat</div>
            <div class="nav-btn" style="font-size:20px;" onclick="clearCurrentHistory()">🗑️</div>
        </div>
        <div id="msg-container"></div>
        <div class="input-area">
            <div id="suggestion-container" class="suggestion-container"></div>
            <div style="display:flex; width:100%; align-items:center;">
                <input type="text" id="chat-input" placeholder="訊息..." autocomplete="off" onkeypress="handleEnter(event)">
                <button id="send-btn" onclick="handleSend()">發送</button>
            </div>
        </div>
    </div>

    <div id="app-social" class="app-window">
        <div class="nav-bar"><div class="nav-btn" onclick="goHome()">‹ 桌面</div><div class="nav-title">FanZone</div><div class="nav-btn">✏️</div></div>
        <div id="social-feed" style="padding:15px; background:#f0f2f5; flex:1; overflow-y: auto;"></div>
    </div>
    
    <div id="app-schedule" class="app-window">
        <div class="nav-bar"><div class="nav-btn" onclick="goHome()">‹ 桌面</div><div class="nav-title">行程表</div><div class="nav-btn"></div></div>
        <div style="padding:10px 15px; display:flex; gap:10px;">
            <button class="comment-btn" onclick="openEventModal()" style="flex:1; padding:10px;">➕ 新增行程</button>
            <button class="comment-btn" onclick="scoutGig()" style="flex:1; padding:10px; background:#9b59b6;">🌟 接通告</button>
        </div>
        <div id="schedule-list" style="padding:20px; background:#f9f9f9; flex:1; overflow-y: auto;"></div>
    </div>

    <!-- Event Modal -->
    <div id="api-key-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">DeepSeek AI Key 設定</div>
            <div class="form-group">
                <label class="form-label" for="manual-api-key">API Key</label>
                <div class="api-key-row">
                    <input type="password" id="manual-api-key" class="form-input" autocomplete="off" placeholder="sk-...">
                    <button type="button" id="api-key-toggle" class="key-toggle" onclick="toggleApiKeyVisibility()" title="顯示 Key">👁️</button>
                </div>
                <small class="form-help">Key 只保留在目前頁面的記憶體；重新整理或關閉頁面後會清除，不會寫入 localStorage。</small>
            </div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeApiKeyModal()">取消</button>
                <button class="modal-btn btn-confirm" onclick="saveApiKey()">套用</button>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">新增行程</div>
            <div class="form-group"><label class="form-label">標題</label><input type="text" id="evt-title" class="form-input"></div>
            <div class="form-group"><label class="form-label">時間</label><input type="text" id="evt-time" class="form-input" placeholder="例如：明天下午2點"></div>
            <div class="form-group">
                <label class="form-label">類型</label>
                <select id="evt-type" class="form-input">
                    <option value="gig">通告</option>
                    <option value="training">訓練</option>
                    <option value="private">私人</option>
                </select>
            </div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeEventModal()">取消</button>
                <button class="modal-btn btn-confirm" onclick="saveManualEvent()">儲存</button>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="modal-overlay">
        <div class="modal-box" style="max-height: 80vh; overflow-y: auto;">
            <div class="modal-title">活動結案報告</div>
            <div id="report-content" style="white-space: pre-wrap; line-height: 1.6; font-size: 14px; color: #333;"></div>
            <div class="modal-btns" style="margin-top: 20px;">
                <button class="modal-btn btn-confirm" onclick="closeReportModal()">關閉</button>
            </div>
        </div>
    </div>

    <div id="home-bar" onclick="goHome()"></div>
</div>

<script>
    // --- 1. API 配置 ---
    let API_KEY = "";
    const API_URL = "https://api.deepseek.com/chat/completions";

    function openApiKeyModal() {
        const input = document.getElementById('manual-api-key');
        input.value = API_KEY;
        input.type = 'password';
        document.getElementById('api-key-toggle').textContent = '👁️';
        document.getElementById('api-key-modal').style.display = 'flex';
        setTimeout(() => input.focus(), 0);
    }

    function closeApiKeyModal() {
        document.getElementById('api-key-modal').style.display = 'none';
    }

    function toggleApiKeyVisibility() {
        const input = document.getElementById('manual-api-key');
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        document.getElementById('api-key-toggle').textContent = showing ? '🙈' : '👁️';
    }

    function saveApiKey() {
        API_KEY = document.getElementById('manual-api-key').value.trim();
        if (!API_KEY) { alert('請輸入 DeepSeek API Key。'); return; }
        closeApiKeyModal();
        alert('AI Key 已套用；重新載入頁面後會自動清除。');
    }

    function requireApiKey() {
        if (!API_KEY) {
            openApiKeyModal();
            throw new Error('尚未設定 DeepSeek API Key');
        }
        return API_KEY;
    }

    // --- 2. 角色資料庫 (演藝圈 Paro 設定) ---
    // 我們將角色分為「Vizier (女團風男團)」與「KAOS (混沌男團)」

    const KAOS_MEMBERS = ['andre', 'narcissus', 'lanlan', 'peter', 'aura'];
    // 定義 Vizier 群組
    const VIZIER_MEMBERS = ['venator', 'lynn', 'jonona', 'miras', 'jacob'];
    // 定義 Staff 群組
    const STAFF_MEMBERS = ['lilith', 'adorabilis', 'manmu', 'poseidon', 'hassel', 'mollie', 'nathanael', 'philippos', 'hades', 'kleion', 'costa', 'novian'];

    const CHARACTERS = {
        'kaos_group': { 
            name: "KAOS 混沌管理處", type: "group", avatar: "https://i.meee.com.tw/hKipIH6.png", 
            members: KAOS_MEMBERS 
        },
        'vizier_group': { 
            name: "Vizier 皇室庭院", type: "group", avatar: "https://i.meee.com.tw/HAvzdTj.png", 
            members: VIZIER_MEMBERS 
        },
        'staff_group': { 
            name: "合作夥伴 & 廠商", type: "group", avatar: "https://i.meee.com.tw/VMWgSj8.png", 
            members: STAFF_MEMBERS 
        },
        
        // KAOS 成員詳細設定
        'andre': { 
            name: "安德烈", avatar: "https://i.meee.com.tw/hKipIH6.png",
            persona: "你是安德烈。KAOS的隊長。\n【性格核心】\n1. 嚴肅認真、一板一眼的發明家。做事講求邏輯和數據。\n2. 【重要】你的專屬口癖是發言前必定加「報告！」。這是你的特徵，別人都沒有。\n3. 雖然語氣強硬，但其實很紳士，會過問他人意願（如：「報告！我可以打你嗎？」）。\n4. 是彼得的親弟弟，經常幫中邪的哥哥寫悔過書，對此感到無奈但責任感強。\n5. 左手的機械外骨骼是你自己做的舞台裝置。\n\n【娛樂圈Paro】\n你是團內唯一的常識人和管家婆。面對成員的失控，你會試圖用科學或物理方式解決。\n\n【關係】\n- 彼得：你哥。雖然他很麻煩，但你是他弟弟，會罩他。\n- 小雅各：隔壁團忙內。你聽得懂他的摩斯電碼心聲，覺得他很可愛，會主動幫他翻譯或解圍。"

    // --- 3. 狀態與邏輯 ---
    let currentChatId = null;
    const chatHistory = {}; // 儲存對話紀錄 { id: [{role, content, senderId}] }
    let socialPosts = [];
    let scheduleEvents = [];
    let currentScheduleGroup = 'kaos'; // 當前查看的行程表群組

    // 初始化
    Object.keys(CHARACTERS).forEach(id => chatHistory[id] = []);
    loadSystem(); // 載入存檔

    // --- 資料保存系統 ---
    function loadSystem() {
        const savedChat = localStorage.getItem('agent_chat_history');
        if(savedChat) Object.assign(chatHistory, JSON.parse(savedChat));

        const savedSocial = localStorage.getItem('agent_social_posts');
        if(savedSocial) socialPosts = JSON.parse(savedSocial);

        const savedSchedule = localStorage.getItem('agent_schedule');
        if(savedSchedule) scheduleEvents = JSON.parse(savedSchedule);
    }

    function saveSystem() {
        localStorage.setItem('agent_chat_history', JSON.stringify(chatHistory));
        localStorage.setItem('agent_social_posts', JSON.stringify(socialPosts));
        localStorage.setItem('agent_schedule', JSON.stringify(scheduleEvents));
    }

    function openApp(id, group) {
        if (id === 'schedule' && group) {
            currentScheduleGroup = group;
            document.querySelector('#app-schedule .nav-title').innerText = (group === 'kaos' ? 'KAOS' : 'Vizier') + ' 行程';
        }
        document.getElementById('app-'+id).classList.add('open');
        document.getElementById('desktop').classList.add('minimized');
        if(id === 'chat') renderChatList();
        if(id === 'social') renderSocial();
        if(id === 'schedule') renderSchedule();
    }
    
    function goHome() {
        document.querySelectorAll('.app-window').forEach(el => el.classList.remove('open'));
        document.getElementById('desktop').classList.remove('minimized');
    }

    function renderChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = '';
        for (const [id, info] of Object.entries(CHARACTERS)) {
            let preview = "點擊開始對話";
            if (chatHistory[id].length > 0) {
                const last = chatHistory[id][chatHistory[id].length-1];
                preview = last.role === 'user' ? `你: ${last.content}` : last.content;
            }
            list.innerHTML += `
                <div class="chat-item" onclick="enterChat('${id}')">
                    <img src="${info.avatar}" class="avatar">
                    <div style="flex:1; overflow:hidden;">
                        <div style="font-weight:bold; color:#333;">${info.name}</div>
                        <div style="font-size:13px; color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${preview}</div>
                    </div>
                </div>`;
        }
    }

    function enterChat(id) {
        currentChatId = id;
        document.getElementById('chat-room').classList.add('open');
        document.getElementById('room-title').innerText = CHARACTERS[id].name;
        renderMessages(id);
    }

    function closeChatRoom() {
        document.getElementById('chat-room').classList.remove('open');
        renderChatList();
    }

    function clearCurrentHistory() {
        if(confirm("確定要刪除此聊天室的紀錄嗎？")) {
            chatHistory[currentChatId] = [];
            saveSystem();
            renderMessages(currentChatId);
            renderChatList();
            closeChatRoom();
        }
    }

    function renderMessages(id) {
        const container = document.getElementById('msg-container');
        container.innerHTML = '';
        const chatInfo = CHARACTERS[id];

            let avatar = null;
            let name = "";
            if (msg.role !== 'user') {
                let senderKey = id;

                if (chatInfo.type === 'group' && msg.senderId && CHARACTERS[msg.senderId]) {
                    senderKey = msg.senderId;
                }
                const sender = CHARACTERS[senderKey];
                if (sender) {
                    avatar = sender.avatar;
                    name = sender.name;
                }
            }
            addMsgToDom(msg.role === 'user' ? 'me' : 'them', avatar, msg.content, name);
        });
    }

    function handleEnter(e) { if(e.key === 'Enter') handleSend(); }

    // --- 核心 AI 發送邏輯 ---
    async function handleSend(optText = null) {
        const input = document.getElementById('chat-input');
        const text = optText || input.value.trim();
        if(!text) return;
        
        document.getElementById('suggestion-container').innerHTML = ''; // 清除建議

        // 1. 顯示玩家訊息
        addMsgToDom('me', null, text);
        chatHistory[currentChatId].push({ role: 'user', content: text });
        saveSystem(); // 保存
        input.value = '';

        const btn = document.getElementById('send-btn');
        btn.disabled = true;

        const chatInfo = CHARACTERS[currentChatId];
        let replyId = currentChatId;
        
        // 2. 智能判斷：如果是群組，先決定「誰」要回覆
        if (chatInfo.type === 'group') {
            // 呼叫 AI 決定發言者
            replyId = await decideSpeaker(chatInfo.members, text);
        }

        // 3. 產生回覆
        const responder = CHARACTERS[replyId];
        const typingBubble = addTypingBubble(responder.avatar, responder.name); // 顯示打字氣泡

        try {
            const replyText = await generateReply(responder, text, chatHistory[currentChatId], currentChatId);
            
            removeTypingBubble(typingBubble); // 移除打字氣泡
            addMsgToDom('them', responder.avatar, replyText, responder.name);
            
            // 存入紀錄 (包含 senderId)
            chatHistory[currentChatId].push({ 
                role: 'assistant', 
                content: replyText,
                senderId: replyId
            });
            saveSystem(); // 保存

            // --- 觸發自動系統 ---
            // 1. 分析行程
            analyzeSchedule(text + " " + replyText, responder);
            // 2. 機率觸發發文 (30% 機率)
            if(Math.random() < 0.3) generateAutoPost(responder, replyText);
            // 3. 生成建議回覆
            generateSuggestions(chatHistory[currentChatId], chatInfo.name);

        } catch (e) {
            console.error(e);
            removeTypingBubble(typingBubble);
            // 離線 Fallback
            const fallback = "（訊號不佳）...喔？";
            addMsgToDom('them', responder.avatar, fallback, responder.name);
        }

        btn.disabled = false;
    }

    // --- AI 功能 1: 決定群組發言者 (Router) ---
    async function decideSpeaker(members, userText) {
        // 構建 Prompt 讓 AI 選人
        const membersInfo = members.map(id => `${id} (${CHARACTERS[id].name}: ${CHARACTERS[id].persona.substr(0, 30)}...)`).join('\n');
        
        const systemPrompt = `
            你是一個群組聊天管理員。玩家發送了訊息："${userText}"。
            群組成員有：
            ${membersInfo}
            請分析玩家是在跟誰說話，或者這句話誰最適合回覆。
            只回傳一個 member_id (例如 "peter")，不要有其他文字。
        `;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${requireApiKey()}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{role: "user", content: systemPrompt}],
                    temperature: 0.1 // 低隨機性，確保準確
                })
            });
            const data = await response.json();
            let chosenId = data.choices[0].message.content.trim().toLowerCase();
            
            // 清理可能的多餘符號
            chosenId = chosenId.replace(/['"]/g, '');
            
            if (members.includes(chosenId)) return chosenId;
            return members[Math.floor(Math.random() * members.length)]; // 如果AI亂回，隨機選

        } catch (e) {
            return members[Math.floor(Math.random() * members.length)]; // 連線失敗隨機選
        }
    }

    // --- AI 功能 2: 生成回覆 ---
    async function generateReply(character, userText, history, chatId) {
        // 構建上下文 (取最後 5 句)
        const recentHistory = history.slice(-10).map(m => {
            const name = m.role === 'user' ? '經紀人' : (CHARACTERS[m.senderId]?.name || character.name);
            return { role: m.role, content: `${name}: ${m.content}` };
        });

        // Inject Schedule Context
        // 找出該角色所屬群組的行程
        let group = 'kaos';
        if (VIZIER_MEMBERS.includes(Object.keys(CHARACTERS).find(k => CHARACTERS[k].name === character.name))) {
            group = 'vizier';
        }
        const scheduleText = scheduleEvents.filter(e => !e.done && (e.group || 'kaos') === group).map(e => `- ${e.time}: ${e.title} (${e.type})`).join('\n');
        const schedulePrompt = scheduleText ? `\n目前未完成的行程表:\n${scheduleText}\n如果玩家提到相關行程，請根據此資訊回覆。` : "";
        
        // 聊天室情境判斷
        const chatInfo = CHARACTERS[chatId];
        let contextPrompt = "";
        if (chatInfo && chatInfo.type === 'group') {
            const membersList = chatInfo.members.map(mid => CHARACTERS[mid].name).join('、');
            contextPrompt = `
                【當前情境】
                你正在「${chatInfo.name}」群組聊天室中。
                群組成員只有：${membersList} (共${chatInfo.members.length}人)。
                請注意：你就是「${character.name}」。請不要扮演其他成員，也不要以為其他團體的人在這裡。
            `;
        } else {
            contextPrompt = `【當前情境】你正在與經紀人(玩家)進行一對一私訊。`;
        }

        const systemPrompt = `
            你現在扮演的角色是：${character.name}。
            
            【你的詳細角色設定】
            ${character.persona}
            
            ${contextPrompt}
            
            【當前情境】
            ${schedulePrompt}
            你正在手機通訊軟體上回覆經紀人(玩家)。
            
            【絕對規則 - 角色扮演】
            1. 你必須完全沉浸在「${character.name}」這個角色中。
            2. 嚴格區分你的角色與其他角色。你不是安德烈就絕對不說「報告！」，你不是蘭蘭就絕對不加「呀」，你不是科絲塔就絕對不加「BATA」，你不是維納托就絕對不自稱「本王」。
            3. 請仔細閱讀對話紀錄中的發言者名字，確保你是在回應正確的對象。
            4. 不要扮演其他角色，也不要替其他角色發言。
            5. 如果對話中有多人，請只關注與你有關的內容或群組話題。
            
            【回覆格式】
            1. 使用繁體中文，口語化，像是在傳訊息。
            2. 不要重複自己的名字（例如不要說「${character.name}: ...」）。
            3. 字數控制在 50 字以內。
        `;

        const messages = [
            { role: "system", content: systemPrompt },
            ...recentHistory,
            { role: "user", content: userText }
        ];

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${requireApiKey()}` },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: messages,
                temperature: 0.7 
            })
        });
        
        const data = await response.json();
        let content = data.choices[0].message.content;

        // 過濾掉可能出現的 "角色名稱: " 前綴
        const nameRegex = new RegExp(`^${character.name}[:：]\\s*`, 'i');
        content = content.replace(nameRegex, '');

        return content;
    }

    // --- AI 功能 3: 行程分析 ---
    async function analyzeSchedule(contextText, character) {
        // 判斷所屬團體
        let group = 'kaos';
        if (VIZIER_MEMBERS.includes(Object.keys(CHARACTERS).find(k => CHARACTERS[k].name === character.name))) {
            group = 'vizier';
        }

        const groupName = group === 'kaos' ? 'KAOS' : 'Vizier';

        const systemPrompt = `
            你是一個行程管理助手。請分析以下對話內容，判斷是否包含新的行程或事件。
            【重要規則】只確認屬於「${groupName}」團體或其成員的行程。如果是其他團體的行程，請忽略。
            如果包含且屬於該團體，請提取「標題」、「時間」和「類型」。
            類型只能是：gig (通告/工作), training (訓練/練習), private (私人/其他)。
            如果不包含，請回傳 JSON: {"hasEvent": false}
            如果包含，請回傳 JSON: {"hasEvent": true, "title": "事件標題", "time": "時間描述", "type": "類型"}
            只回傳 JSON，不要有其他文字。
        `;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${requireApiKey()}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role: "system", content: systemPrompt},
                        {role: "user", content: contextText}
                    ],
                    temperature: 0.1,
                    response_format: { type: "json_object" }
                })
            });
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);
            
            if (result.hasEvent) {
                scheduleEvents.push({
                    id: Date.now(),
                    title: result.title,
                    time: result.time,
                    type: result.type || 'private',
                    group: group,
                    done: false
                });
                saveSystem();
                // 可以在這裡加個通知提示
            }
        } catch (e) { console.error("Schedule analysis failed", e); }
    }

    // --- AI 功能 5: 生成建議回覆 ---
    async function generateSuggestions(history, charName) {
        const recentHistory = history.slice(-5).map(m => `${m.role==='user'?'經紀人':(CHARACTERS[m.senderId]?.name||charName)}: ${m.content}`).join('\n');
        const systemPrompt = `
            你是一個專業的經紀人助手。你正在與「${charName}」對話。
            請根據以下對話紀錄，為「經紀人」生成 2 個簡短的回覆選項。
            回覆要符合經紀人的口吻，簡潔有力。
            只回傳 JSON 格式：{"options": ["選項1", "選項2"]}
        `;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${requireApiKey()}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role: "system", content: systemPrompt},
                        {role: "user", content: recentHistory}
                    ],
                    temperature: 0.7,
                    response_format: { type: "json_object" }
                })
            });
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);
            
            const container = document.getElementById('suggestion-container');
            container.innerHTML = '';
            if(result.options && Array.isArray(result.options)) {
                result.options.forEach(opt => {
                    const chip = document.createElement('div');
                    chip.className = 'suggestion-chip';
                    chip.innerText = opt;
                    chip.onclick = () => handleSend(opt);
                    container.appendChild(chip);
                });
            }
        } catch (e) { console.error("Suggestion generation failed", e); }
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-list');
        container.innerHTML = '';

        // 篩選當前群組的行程
        const filteredEvents = scheduleEvents.filter(e => (e.group || 'kaos') === currentScheduleGroup);
        
        // Sort: Pending first, then Done
        filteredEvents.sort((a, b) => (a.done === b.done) ? 0 : a.done ? 1 : -1);

        if (filteredEvents.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">暫無行程</div>';
            return;
        }

        filteredEvents.forEach((item) => {
            // 找出原始 index 以便刪除/更新
            const originalIndex = scheduleEvents.indexOf(item);
            const typeLabel = item.type === 'gig' ? '通告' : (item.type === 'training' ? '訓練' : (item.type === 'private' ? '私人' : '其他'));
            const reportBtn = item.report ? `<span style="cursor:pointer; margin-right:5px;" onclick="viewReport(${originalIndex})">📄</span>` : '';
            
            container.innerHTML += `
                <div class="schedule-item ${item.done ? 'done' : ''}">
                    <div style="display:flex; align-items:center; flex:1;">
                        <div class="schedule-check ${item.done ? 'done' : ''}" onclick="toggleSchedule(${originalIndex})">
                            ${item.done ? '☑' : '☐'}
                        </div>
                        <div>
                        <div class="schedule-time">${item.time}</div>
                        <div class="schedule-title"><span class="tag ${item.type || 'private'}">${typeLabel}</span>${item.title}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        ${reportBtn}
                        <div class="schedule-delete" onclick="deleteSchedule(${originalIndex})">×</div>
                    </div>
                </div>`;
        });
    }

    async function toggleSchedule(index) {
        const item = scheduleEvents[index];
        item.done = !item.done;
        saveSystem();
        renderSchedule();

        // 如果標記為完成且沒有報告，則生成報告
        if (item.done && !item.report) {
            await generateActivityReport(index);
        }
    }

        document.getElementById('report-modal').style.display = 'flex';

        const systemPrompt = `
            你是一個娛樂公司的活動紀錄員。
            請根據以下資訊生成一份「活動結案報告」。
            活動名稱：${item.title}
            負責人/對接窗口：${contact.name}
            參與團體：${item.group === 'kaos' ? 'KAOS' : 'Vizier'}
            
            請包含以下四點（請發揮創意，根據負責人性格和團體風格編寫有趣的內容）：
            1. 高光時刻 (Highlights)
            2. 意外插曲/黑料 (Scandals/Incidents)
            3. 成員表現 (Member Performance)
            4. 結論 (Conclusion)
            
            字數約 150 字。
        `;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${requireApiKey()}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{role: "user", content: systemPrompt}],
                    temperature: 0.8
                })
            });
            const data = await response.json();
            const report = data.choices[0].message.content;
            
            item.report = report;
            saveSystem();
            renderSchedule(); // 更新按鈕
            document.getElementById('report-content').innerText = report;
        } catch (e) {
            console.error("Report generation failed", e);
            document.getElementById('report-content').innerText = "報告生成失敗。";
        }
    }

    function viewReport(index) {
        const item = scheduleEvents[index];
        if (item.report) {
            document.getElementById('report-content').innerText = item.report;
            document.getElementById('report-modal').style.display = 'flex';
        }
    }

    function deleteSchedule(index) {
        scheduleEvents.splice(index, 1);
        saveSystem();
        renderSchedule();
    }

    function addMsgToDom(side, avatar, text, name) {
        const container = document.getElementById('msg-container');
        let html = '';
        if (side === 'me') {
            html = `<div class="msg-row me"><div class="msg-bubble me">${text}</div></div>`;
        } else {
            html = `
                <div class="msg-row">
                    <img src="${avatar}" class="msg-avatar">
                    <div style="display:flex; flex-direction:column; max-width:80%;">
                        <span class="msg-name">${name}</span>
                        <div class="msg-bubble them">${text}</div>
                    </div>
                </div>`;
        }
        container.insertAdjacentHTML('beforeend', html);
        container.scrollTop = container.scrollHeight;
    }

    function addTypingBubble(avatar, name) {
        const container = document.getElementById('msg-container');
        const div = document.createElement('div');
        div.className = 'msg-row';
        div.innerHTML = `
            <img src="${avatar}" class="msg-avatar">
            <div style="display:flex; flex-direction:column; max-width:80%;">
                <span class="msg-name">${name}</span>
                <div class="msg-bubble them"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            </div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function removeTypingBubble(element) {
        if(element && element.parentNode) element.remove();
    }

</script>
</body>
</html>
